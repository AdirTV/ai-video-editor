[project]
name = "mce"
version = "0.1.0"
description = "Minecraft auto-editor: analyze gameplay recordings and export Premiere Pro sequences"
requires-python = ">=3.12,<3.13"
dependencies = [
    "whisperx==3.8.6",
    "opencv-python-headless>=4.10,<5",  # 5.x removed CascadeClassifier (face detection)
    "numpy",
    "librosa>=1.0.0",
    "scenedetect>=0.7.2",  # shot boundaries (mce.scenes)
    "demucs>=4.1.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",  # stems (mce.stems); no Intel-Mac wheels
    "mlx-whisper>=0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",  # GPU transcription on Apple Silicon
]

[tool.uv]
# scenedetect asks for the full opencv-python (now 5.x); we ship the headless 4.x build instead.
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[project.scripts]
mce = "mce.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
